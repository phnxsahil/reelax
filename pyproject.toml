[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reelax"
version = "0.3.3"
description = "Auto-scroll Instagram Reels while you code"
readme = "README.md"
authors = [
    { name = "Developer", email = "dev@example.com" }
]
requires-python = ">=3.10"
keywords = ["instagram", "reels", "developer-tools", "adb", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pystray>=0.19",
    "Pillow>=10.0",
    "pynput>=1.7.6",
    "uiautomator2>=3.0.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "pydantic>=2.5.2",
    "PyYAML>=6.0.1",
    "loguru>=0.7.2",
]

[project.gui-scripts]
reelax = "reelax.tray:run_tray"

[project.urls]
Homepage = "https://github.com/phnxsahil/reelax"
Issues = "https://github.com/phnxsahil/reelax/issues"

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
